# Builds and deploys the project website to GitHub Pages:
# site/index.html + every report template rendered to HTML/PDF/Word/Excel/CSV
# + the chat-app packages. One-time setup: Settings > Pages > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "skills/**", "install.sh", "install.ps1", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # daily rebuild publishes posts whose date has arrived

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          set -euo pipefail
          python site/build.py --out _site
          mkdir -p _site/reports _site/downloads
          SK=skills/br-web-seo
          for f in $SK/templates/*.md $SK/templates/examples/*.md; do
            python $SK/scripts/export_report.py "$f" -f md,html,pdf,docx,xlsx,csv -o _site/reports
          done
          (cd _site/downloads && bash "$GITHUB_WORKSPACE/install.sh" --package)
          ls -la _site/reports _site/downloads
          test -f _site/reports/sample-audit-report.pdf

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Tell Bing (and other IndexNow engines) about today's new posts.
      - uses: actions/checkout@v7
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os, re, urllib.request
          base = "https://burhanriaz.github.io/BR-SEO-Skill"
          key = next(os.path.basename(f)[:-4] for f in glob.glob("site/*.txt")
                     if re.fullmatch(r"[0-9a-f]{32}\.txt", os.path.basename(f)))
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          plan = json.load(open("site/blog/plan.json"))
          urls = [base + "/", base + "/blog/"] + [
              "%s/blog/%s/" % (base, p["slug"]) for p in plan if p["date"] == today]
          body = json.dumps({"host": "burhanriaz.github.io", "key": key,
                             "keyLocation": "%s/%s.txt" % (base, key), "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow", r.status, "for", len(urls), "URLs:", *urls, sep="\n  ")
          PY
