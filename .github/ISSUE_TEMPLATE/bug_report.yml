name: Bug report
description: The skill, an installer or the exporter did something wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problem? Don't file it here. Use **Security → Report a vulnerability** instead (see SECURITY.md)."
  - type: dropdown
    id: area
    attributes:
      label: What's affected?
      options:
        - Skill instructions / audit results
        - Report templates
        - Exporter (PDF / Word / Excel / CSV / HTML)
        - Installer (install.sh / install.ps1)
        - Website (GitHub Pages)
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent or app
      multiple: true
      options: [Claude Code, Claude.ai, Codex, ChatGPT, Gemini CLI, Gemini, GitHub Copilot, Cursor, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The prompt you used, the command you ran, and the target URL or repo if you can share it.
      placeholder: |
        1. Installed with ...
        2. Asked "Use the br-web-seo skill to audit ..."
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and versions
      placeholder: "Windows 11, PowerShell 5.1, Python 3.12"
